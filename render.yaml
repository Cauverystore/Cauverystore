services:
  - type: web
    name: cauvery-store-backend
    env: docker
    repo: https://github.com/Cauverystore/Cauverystore
    branch: main
    dockerfilePath: backend-java/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://cauverystore.in,https://www.cauverystore.in,https://frontend-1vkqh4fra-cauvery-store.vercel.app
      - key: SPRING_CACHE_TYPE
        value: simple

# Database will be created manually from Render dashboard
