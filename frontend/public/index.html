<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#16a34a" />
  <!-- No static meta description here: every page sets its own through Helmet, and a second tag here made two per page. -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Cauvery Store | Online Shopping in India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without holding up the first paint. Body fonts swap in when they arrive.
       The headline font (Fraunces) uses display=optional: if it is not ready almost at once, the first
       view keeps the fallback serif instead of redrawing the big homepage heading late, which
       PageSpeed counts as a slow Largest Contentful Paint. Later page views have it cached. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=optional" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=optional"></noscript>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function () {
      var gaId = '%REACT_APP_GA_MEASUREMENT_ID%';
      if (!gaId || gaId.charAt(0) === '%') return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      // Analytics cookies stay off until the visitor accepts them in the cookie banner.
      var consent = null;
      try { consent = localStorage.getItem('cs_cookie_consent'); } catch (e) { /* storage blocked */ }
      var granted = consent === 'accepted' ? 'granted' : 'denied';
      window.gtag('consent', 'default', {
        analytics_storage: granted, ad_storage: granted,
        ad_user_data: granted, ad_personalization: granted
      });
      window.gtag('js', new Date());
      window.gtag('config', gaId);
    })();
  </script>
</head>
<body>
  <noscript>Please turn on JavaScript in your browser to shop at Cauvery Store.</noscript>
  <div id="root"></div>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/service-worker.js'); }); }</script>
</body>
</html>
