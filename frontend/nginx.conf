server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:9091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Processed images are stored by the Node image-service and served from here.
    # The service hostname must be reachable from the frontend container
    # (docker-compose service "images" / Railway service alias "images").
    location /uploads/ {
        proxy_pass http://images:9092/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
