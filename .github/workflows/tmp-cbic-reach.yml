name: TEMP CBIC reachability test
on:
  push:
    branches: [fix/gst-watch-cbic-reach]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the watcher read-only (no commits, PRs or issues)
        run: |
          T=backend-java/src/main/resources/master-data/tools
          mkdir -p "$RUNNER_TEMP/src" && cp backend-java/src/main/resources/master-data/cbic-source/manifest.json "$RUNNER_TEMP/src/"
          python -I "$T/watch_gst_sources.py" --source-dir "$RUNNER_TEMP/src" --report-dir "$RUNNER_TEMP/rep" --delay 1
          cat "$RUNNER_TEMP/rep/report.json"
          grep -A8 "could NOT be checked" "$RUNNER_TEMP/rep/report.md"
          grep -A6 "^## Checked" "$RUNNER_TEMP/rep/report.md"
