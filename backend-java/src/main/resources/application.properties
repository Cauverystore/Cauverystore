spring.datasource.url=jdbc:postgresql://localhost:5432/cauverystore
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
server.port=9091
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:placeholder}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:placeholder}
resend.api.key=${RESEND_API_KEY:re_placeholder}
resend.from.email=Cauvery Store <noreply@cauverystore.in>
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey12345mysecretkeymysecretkeymysecretkey12345}
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO
logging.level.com.cauverystore=DEBUG
analytics.snapshot.enabled=true
analytics.cache.enabled=true
analytics.alerts.enabled=true
cors.allowed-origins=http://localhost:3000,http://localhost:3001
