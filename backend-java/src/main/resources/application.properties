# Database is configured programmatically in DatabaseConfig.java

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Razorpay
# ===============================
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:placeholder}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:placeholder}

# ===============================
# Google Sign-In
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:}

# ===============================
# Resend Email
# ===============================
resend.api.key=${RESEND_API_KEY:re_placeholder}
# Must be an address on a domain VERIFIED in Resend. Resend rejects anything else, and the
# rejection is logged and swallowed - so an unverified domain looks exactly like working
# email until somebody notices no password reset ever arrived.
resend.from.email=${RESEND_FROM_EMAIL:Cauvery Store <noreply@cauverystore.in>}
frontend.url=${FRONTEND_URL:https://cauverystore.in}

# ===============================
# Image service (Node pipeline)
# ===============================
app.image-service.url=${IMAGE_SERVICE_URL:http://localhost:9092}

# ===============================
# Cache / Flyway
# ===============================
spring.cache.type=simple
spring.flyway.enabled=false

# ===============================
# Seeding
# ===============================
app.seed.demo-products=${APP_SEED_DEMO_PRODUCTS:true}

# ===============================
# JWT
# ===============================
# No default: startup FAILS FAST if JWT_SECRET is not provided, so a fresh clone or
# misconfigured deployment can never sign tokens with a known, hardcoded secret.
# Generate one with: node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
jwt.secret=${JWT_SECRET}
# Refresh-token JWT lifetime; must stay in step with AUTH_COOKIE_MAX_AGE_SECONDS.
jwt.refresh.expiry-millis=${JWT_REFRESH_EXPIRY_MILLIS:604800000}

# ===============================
# Refresh token cookie (HttpOnly)
# ===============================
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.samesite=${AUTH_COOKIE_SAMESITE:lax}
auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:604800}

# ===============================
# Rate limiting
# ===============================
auth.rate-limit.login-ip-max=${AUTH_RATE_LIMIT_LOGIN_IP_MAX:20}
auth.rate-limit.register-ip-max=${AUTH_RATE_LIMIT_REGISTER_IP_MAX:5}
auth.rate-limit.otp-email-max=${AUTH_RATE_LIMIT_OTP_EMAIL_MAX:5}
auth.rate-limit.otp-ip-max=${AUTH_RATE_LIMIT_OTP_IP_MAX:10}
auth.rate-limit.verify-otp-email-max=${AUTH_RATE_LIMIT_VERIFY_OTP_EMAIL_MAX:10}
auth.rate-limit.reset-email-max=${AUTH_RATE_LIMIT_RESET_EMAIL_MAX:5}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO
logging.level.com.cauverystore=DEBUG

# ===============================
# Analytics
# ===============================
analytics.snapshot.enabled=true
analytics.cache.enabled=true
analytics.alerts.enabled=true

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://cauverystore.in,https://www.cauverystore.in,https://frontend-lyart-eight-97.vercel.app

# ===============================
# GST Sync
# ===============================
gst.sync.enabled=true

# --- e-invoice portal (IRP) ---------------------------------------------------
# true keeps the simulator, which generates local IRNs for development. The store is INACTIVE
# against the real IRP until gstn.simulated=false AND all six credentials below are set; the
# admin readiness endpoint (/api/admin/gst/readiness) reports this as INACTIVE / MISCONFIGURED /
# ACTIVE so the state is never assumed.
#
# Activating is a two-step, deliberate process:
#   1. Create a NIC sandbox account at the GSTN e-invoice sandbox portal
#      (https://einvoice1.gst.gov.in > Registration for Sandbox) under the real GSTIN; then on
#      the developer portal (https://developer.gst.gov.in) create an API account with a GSP to
#      get client-id, client-secret, username, password, and the IRP RSA public key. The IRP
#      public key for the production portal is published at
#      https://www.gst.gov.in/download/IRP_PUBLIC_KEY_PROD (base64 DER) - never trust a key
#      from anywhere else.
#   2. Run the client against the NIC sandbox BEFORE production. LiveGstnClient was written
#      from the API spec and has never made a real call - the auth handshake in particular is
#      either exactly right or completely wrong.
#
# E-invoicing is compulsory only above the aggregate-turnover threshold (Rs 5 crore since
# 01-08-2023) and only for B2B / export / SEZ invoices; B2C retail never needs an IRN. Below
# the threshold this block should simply stay off.
gstn.simulated=true
# gstn.base-url=https://einvapi.gst.gov.in
# gstn.client-id=
# gstn.client-secret=
# gstn.username=
# gstn.password=
# gstn.gstin=
# gstn.public-key=

# --- GST ----------------------------------------------------------------------
# There is deliberately NO fallback rate and no switch to disable the rules. A rate that cannot
# be determined is not charged - the supply is refused - because every figure on a tax invoice
# has to be one CBIC published for those goods. Run /api/admin/gst/readiness before deploying
# to see which live products that affects.

# --- GST rate verification ----------------------------------------------------
# CBIC's notification API requires credentials, so rates cannot be polled. What is automated is
# the chasing: how long since a human last confirmed no newer Central Tax (Rate) notification
# exists. Reported, never enforced - halting a shop because nobody clicked a button would cause
# certain harm to avoid a possible one.
gst.rate-verification.due-after-days=30
gst.rate-verification.overdue-after-days=60
gst.rate-verification.cron=0 30 6 * * ?
