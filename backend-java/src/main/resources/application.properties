# Database is configured programmatically in DatabaseConfig.java

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Razorpay
# ===============================
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:placeholder}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:placeholder}

# ===============================
# Google Sign-In
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:}

# ===============================
# Resend Email
# ===============================
resend.api.key=${RESEND_API_KEY:re_placeholder}
resend.from.email=Cauvery Store <noreply@cauverystore.in>
frontend.url=${FRONTEND_URL:https://cauverystore.in}

# ===============================
# Cache / Flyway
# ===============================
spring.cache.type=simple
spring.flyway.enabled=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey12345mysecretkeymysecretkeymysecretkey12345}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO
logging.level.com.cauverystore=DEBUG

# ===============================
# Analytics
# ===============================
analytics.snapshot.enabled=true
analytics.cache.enabled=true
analytics.alerts.enabled=true

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://cauverystore.in,https://www.cauverystore.in,https://frontend-lyart-eight-97.vercel.app

# ===============================
# GST Sync
# ===============================
gst.sync.enabled=true
